name: Publish csworld

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        working-directory: claude-world
        run: pnpm install --frozen-lockfile

      - name: Set package version to match release tag
        working-directory: claude-world
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add claude-world/package.json
          git diff --cached --quiet || git commit -m "chore: release csworld ${GITHUB_REF_NAME}"
          git push origin HEAD:master

      - name: Publish to GitHub Packages
        working-directory: claude-world
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
